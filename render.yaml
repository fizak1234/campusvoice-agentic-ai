services:
  # FastAPI Web Service
  - type: web
    name: ai-grievance-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: ai-grievance-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OLLAMA_URL
        value: "http://localhost:11434/api/generate"

databases:
  # Managed PostgreSQL Database
  - name: ai-grievance-db
    databaseName: ai_grievance_db
    user: postgres
    region: oregon
    plan: free
